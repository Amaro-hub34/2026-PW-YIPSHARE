<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - YipShare</title>
    <link rel="icon" type="image/png" href="../img/logo_yipshare_icono.png">
    <link rel="stylesheet" href="../src/output.css">
</head>


<body class="m-0 min-h-screen flex flex-col items-center justify-center bg-cover bg-center px-4 py-10 font-sans text-[#1e2b45]"
      style="background-image: url('../img/img.png'), linear-gradient(to bottom, #1e4a73, #2f78b8);">

<a href="../index.html" aria-label="YipShare - inicio" class="mb-4">
    <img src="../img/logo_yipshare_icono.png" alt="Logo de YipShare" class="h-28 w-auto md:h-35">
</a>

<form id="form-login" novalidate
      class="w-full max-w-md rounded-3xl bg-white px-8 pt-6 pb-4 shadow-xl">

    <h1 class="m-0 text-center text-3xl font-black uppercase tracking-wide">Crear Cuenta</h1>

    <div class="mt-4">
        <label for="apelido-paterno" class="sr-only">Apellido Paterno</label>
        <div class="relative">
            <input type="text" id="apelido-paterno" name="name" placeholder="Apellido Paterno" required autocomplete="nombre"
                   class="w-full rounded-lg border border-slate-600 bg-[#eeeeee] py-2 pl-11 pr-3 text-lg text-slate-700 focus:outline-2 focus:outline-[#2a6aa8]">
        </div>
        <span id="error-apellido-paterno" class="mt-1 block text-sm text-red-600"></span>
    </div>

    <div class="mt-4">
        <label for="apellido-materno" class="sr-only">Apellido Materno</label>
        <div class="relative">
            <input type="text" id="apellido-materno" name="name" placeholder="Apellido Materno" required autocomplete="nombre"
                   class="w-full rounded-lg border border-slate-600 bg-[#eeeeee] py-2 pl-11 pr-3 text-lg text-slate-700 focus:outline-2 focus:outline-[#2a6aa8]">
        </div>
        <span id="error-apellido-materno" class="mt-1 block text-sm text-red-600"></span>
    </div>
    <div class="mt-4">
        <label for="name" class="sr-only">Apellido Materno</label>
        <div class="relative">
            <input type="text" id="name" name="name" placeholder="Nombre" required autocomplete="nombre"
                   class="w-full rounded-lg border border-slate-600 bg-[#eeeeee] py-2 pl-11 pr-3 text-lg text-slate-700 focus:outline-2 focus:outline-[#2a6aa8]">
        </div>
        <span id="error-name" class="mt-1 block text-sm text-red-600"></span>
    </div>

    <div class="mt-2 flex justify-center">
        <a href="./register_2.html" class="w-3/4 mt-6">
            <button type="button" id="boton-entrar"
                    class="w-full cursor-pointer rounded-lg bg-[#1e2b45] py-2 text-white shadow-md transition hover:bg-[#2f4268]">
                Siguiente
            </button>
        </a>
    </div>


    <p id="mensaje-exito" class="mt-2 min-h-5 text-center text-sm font-semibold text-green-700"></p>

    <p class="mt-4 text-center text-xs text-slate-600">
        Conoce Nuestros terminos y condiciones y nuestra política de privacidad. Al registrarte, aceptas nuestros términos y condiciones y nuestra política de privacidad.
        <a href="#" class="ml-1 font-bold text-[#2a6aa8] hover:underline">Conocelos</a>
</form>
<script src="../js/visual.js"></script>
</body>
</html>
