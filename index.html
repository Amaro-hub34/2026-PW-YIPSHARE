<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YipShare</title>
    <link rel="icon" type="image/png" href="./img/logo_yipshare_icono.png">
    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="relative m-0 min-h-screen flex flex-col bg-linear-to-b from-[#24557f] to-[#3b8bd9] text-white font-sans">

<div id="lluvia-casas" aria-hidden="true"
     class="pointer-events-none fixed inset-0 overflow-hidden"></div>

<header class="relative z-10 bg-[#1e4a73]/80">
    <nav class="flex flex-wrap items-center justify-between gap-4 px-4 py-3 md:px-6">

        <div class="flex items-center gap-6 md:gap-8">
            <a href="#" aria-label="YipShare - inicio">
                <img src="./img/logo_yipshare_icono.png" alt="Logo de YipShare" class="h-9 w-auto">
            </a>

            <ul class="hidden md:flex items-center gap-8 text-sm font-semibold list-none m-0 p-0">
                <li><a href="./LandinPage/contact.html" class="text-white no-underline hover:underline">Contáctanos</a></li>
            </ul>
        </div>

        <div class="flex items-center gap-3">
            <a href="./YipShare/login.html" class="w-32 rounded-full bg-[#2a6aa8] py-1 text-center text-sm font-bold text-white transition hover:bg-[#3b86cc]">
                Iniciar Sesión
            </a>
            <a href="./YipShare/register_1.html" class="w-32 rounded-full bg-white py-1 text-center text-sm font-bold text-[#1e4a73] transition hover:bg-sky-200">
                Registrarse
            </a>
        </div>

    </nav>
</header>

<main class="relative z-10 flex flex-1 flex-col items-center justify-center px-4 py-24 text-center">
    <h1 class="m-0 text-4xl font-bold md:text-6xl">Bienvenido a YipShare</h1>
    <p class="mt-2 text-xl font-semibold md:text-2xl">El valor está en el uso no en la posesión</p>

    <a href="./YipShare/login.html" class="mt-10 rounded-lg bg-[#1e2b45] px-16 py-2 text-xl text-white no-underline hover:bg-[#263756]">
        ¡Empezar!
    </a>
</main>

<script>
    (function () {
        const capa = document.getElementById('lluvia-casas');

        const casaHTML = `<img src="./img/logo_yipshare_icono.png" alt="" class="h-full w-full object-contain">`;


        const CANTIDAD = 18;

        for (let i = 0; i < CANTIDAD; i++) {
            const casa = document.createElement('div');
            casa.className = 'casa';
            casa.innerHTML = casaHTML;

            const tamano = 20 + Math.random() * 40;
            casa.style.left = Math.random() * 100 + 'vw';
            casa.style.width = casa.style.height = tamano + 'px';
            casa.style.animationDuration = (8 + Math.random() * 10) + 's';
            casa.style.animationDelay = (-Math.random() * 15) + 's';
            casa.style.setProperty('--op', (0.08 + Math.random() * 0.22).toFixed(2));
            casa.style.setProperty('--giro', (Math.random() * 360 - 180) + 'deg');

            capa.appendChild(casa);
        }
    })();
</script>

</body>
</html>
