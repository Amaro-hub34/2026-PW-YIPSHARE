<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/logo_StartUpIDEA.png">
    <title>Contacto - StartUP IDEA</title>
    <link rel="stylesheet" href="../src/output.css">
</head>

<body class="min-h-screen flex flex-col bg-linear-to-b from-[#24557f] to-[#3b8bd9] text-white font-sans">

<header class="bg-[#1e4a73]/80">
    <nav class="flex flex-wrap items-center justify-between gap-4 px-4 py-3 md:px-6">

        <div class="flex items-center gap-6 md:gap-8">
            <a href="../index.html" aria-label="YipShare - inicio">
                <img src="../img/logo_yipshare_icono.png" alt="Logo de YipShare" class="h-9 w-auto">
            </a>

            <ul class="hidden md:flex items-center gap-8 text-sm font-semibold">
                <li><a href="./ourProducts.html" class="hover:underline">Nuestros Productos</a></li>
                <li><a href="./ourSuccesses.html" class="hover:underline">Casos de Éxito</a></li>
                <li><a href="./aboutUs.html" class="hover:underline">Conócenos</a></li>
                <li><a href="./contact.html" class="underline">Contáctanos</a></li>
            </ul>
        </div>

        <div class="flex items-center gap-3">
            <a href="#" class="w-32 rounded-full bg-[#2a6aa8] py-1 text-center text-sm font-bold text-white transition hover:bg-[#3b86cc]">
                Iniciar Sesión
            </a>
            <a href="#" class="w-32 rounded-full bg-white py-1 text-center text-sm font-bold text-[#1e4a73] transition hover:bg-sky-200">
                Registrarse
            </a>
        </div>

    </nav>
</header>

<main class="flex flex-1 flex-col items-center justify-center px-4 py-10">

    <form id="form-registro" novalidate
          class="w-full max-w-md rounded-3xl bg-white px-8 py-8 text-[#1e2b45] shadow-xl">

        <h1 class="text-center text-3xl font-black uppercase tracking-wide">Contáctanos</h1>
        <p class="mt-1 text-center text-sm text-slate-500">Contáctanos para más información</p>

        <!-- Nombre -->
        <div class="mt-6">
            <label for="nombre" class="sr-only">Nombre</label>
            <div class="relative">
                <svg class="pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-500"
                     xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
                <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required
                       class="w-full rounded-lg border border-slate-600 bg-[#eeeeee] py-2 pl-11 pr-3 text-lg text-slate-700 placeholder:text-slate-500 focus:outline-2 focus:outline-[#2a6aa8]">
            </div>
            <span id="error-nombre" class="mt-1 block min-h-5 text-sm text-red-600"></span>
        </div>

        <div class="mt-3">
            <label for="correo" class="sr-only">Correo electrónico</label>
            <div class="relative">
                <svg class="pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-500"
                     xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2"/>
                    <path d="m3 7 9 6 9-6"/>
                </svg>
                <input type="email" id="correo" name="correo" placeholder="Correo Electrónico" required
                       class="w-full rounded-lg border border-slate-600 bg-[#eeeeee] py-2 pl-11 pr-3 text-lg text-slate-700 placeholder:text-slate-500 focus:outline-2 focus:outline-[#2a6aa8]">
            </div>
            <span id="error-correo" class="mt-1 block min-h-5 text-sm text-red-600"></span>
        </div>

        <div class="mt-3">
            <label for="mensaje" class="sr-only">Mensaje</label>
            <div class="relative">
                <svg class="pointer-events-none absolute left-3 top-3 h-5 w-5 text-slate-500"
                     xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/>
                </svg>
                <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required
                          class="w-full resize-none rounded-lg border border-slate-600 bg-[#eeeeee] py-2 pl-11 pr-3 text-lg text-slate-700 placeholder:text-slate-500 focus:outline-2 focus:outline-[#2a6aa8]"></textarea>
            </div>
            <span id="error-mensaje" class="mt-1 block min-h-5 text-sm text-red-600"></span>
        </div>

        <div class="mt-4 flex justify-center">
            <button type="submit" id="boton-registrar"
                    class="w-3/4 cursor-pointer rounded-lg bg-[#1e2b45] py-2 text-white shadow-md transition hover:bg-[#2f4268]">
                Enviar Mensaje
            </button>
        </div>

        <p id="mensaje-exito" class="mt-3 min-h-5 text-center text-sm font-semibold text-green-700"></p>

        <p class="mt-4 text-center text-xs text-slate-600">
            ¿Prefieres volver?
            <a href="../index.html" class="ml-1 font-bold text-[#2a6aa8] hover:underline">Volver al Inicio</a>
        </p>
    </form>

</main>
<script src="./js/validaciones_landinPage.js"></script>
</body>
</html>
